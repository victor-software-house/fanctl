name: Release

# verctl's reusable release workflow, on every push to main and on demand.
# It plans every version commit not yet fully released and publishes each at
# that commit: a tag and a GitHub Release with no registry upload
# (publisher: none), then the static musl tarball .ctl/ver.yaml declares.
# Then it opens or updates the Version PR on verctl/release/main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    permissions:
      contents: write # tags, Releases, assets, and verctl/release/main without the App
      pull-requests: write # the Version PR without the App
      id-token: write # the reusable workflow's publish job requests it
    uses: victor-software-house/verctl/.github/workflows/release.yml@ff96452d1efb4cb2657a1d70af68984bd2fab601 # v0.7.2
    with:
      mise-version: 2026.11.1
      mise-env: ci
      # Nothing goes to crates.io, so there is no docs.rs page to wait for.
      docs: false
    # The App token opens the Version PR so that its CI starts; a PR opened
    # with GITHUB_TOKEN starts no workflow.
    secrets:
      app-client-id: ${{ secrets.CHANGESET_VERSION_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.CHANGESET_VERSION_APP_PRIVATE_KEY }}
